name: Verify error handler

on:
  push:
    branches: [refactor/error-handler-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: error-handler-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find src tests benchmarks -type f \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n 1 php -l
      - run: composer test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer require --dev --no-interaction --no-update 'componenta/di:^6.0@dev'
      - run: composer update --no-interaction --prefer-dist
      - run: composer test:integration
